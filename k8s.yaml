# Generated by Watchbell 1.6.0 from linkhub's settings — review before use.
# The app's env values live in a Secret you create once on the cluster, never in this file:
#   kubectl create secret generic linkhub-env --from-env-file=.env
# It needs these names:
#   CRON_SECRET
#   EMAIL_FROM
#   NEXT_PUBLIC_SITE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   RESEND_API_KEY
#   SUPABASE_SERVICE_ROLE_KEY
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkhub
  labels:
    app: linkhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkhub
  template:
    metadata:
      labels:
        app: linkhub
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/trias1/linkhub:latest # change to the image you push
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: linkhub-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: linkhub
spec:
  selector:
    app: linkhub
  ports:
    - port: 80
      targetPort: 3000
